# AGERE simulation stack — PX4 + Gazebo Harmonic
# Native Linux version for Intel integrated graphics (no NVIDIA)
#
# Run from project root with:
#   docker compose up -d

services:
  px4-sitl-gazebo:
    image: px4io/px4-sitl-gazebo:latest
    container_name: agere-px4-sitl
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - PX4_SIM_MODEL=${PX4_SIM_MODEL:-gz_x500_depth}
      - PX4_GZ_WORLD=${PX4_GZ_WORLD:-default}
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      # For Intel integrated graphics rendering
      - LIBGL_ALWAYS_SOFTWARE=0
      - MESA_GL_VERSION_OVERRIDE=3.3
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
    devices:
      - /dev/dri:/dev/dri
    # Remove restart if you want manual control
    restart: unless-stopped
